<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARGUS OAuth Callback</title>
</head>
<body>
  <h2>ARGUS — Mercado Livre OAuth</h2>

  <p id="status">Processando retorno...</p>

  <div id="result" hidden>
    <p>Autorização recebida.</p>

    <label>Authorization code:</label><br>
    <textarea id="code" rows="4" cols="70" readonly></textarea>

    <br><br>

    <label>State:</label><br>
    <textarea id="state" rows="2" cols="70" readonly></textarea>

    <p>
      Não compartilhe esses valores.
      Volte ao ARGUS para concluir a autenticação.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");
    const errorDescription = params.get("error_description");

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    if (error) {
      status.textContent =
        "OAuth retornou erro: " +
        error +
        (errorDescription ? " — " + errorDescription : "");
    } else if (code) {
      status.textContent = "Retorno OAuth recebido com sucesso.";
      document.getElementById("code").value = code;
      document.getElementById("state").value = state || "";
      result.hidden = false;
    } else {
      status.textContent =
        "Callback ARGUS ativo. Nenhum authorization code recebido.";
    }
  </script>
</body>
</html>
